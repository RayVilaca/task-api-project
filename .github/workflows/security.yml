name: Security

on:
  pull_request:
    branches: ["main"]
  schedule:
  - cron: "0 2 * * 1-5"

jobs:
  code-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Pip Audit
        uses: lazy-actions/pip-audit-action@v1
        with:
          type: pip

      - name: Set Docker Build
        uses: docker/setup-buildx-action@v3.11.1

      - name: Build Docker Image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./Dockerfile
          outputs: type=docker,dest=/tmp/image.tar
          tags: ${{ secrets.DOCKERHUB_USER }}/task-api-scan:latest
      
      - name: Container Scan
        id: scan
        uses: crazy-max/ghaction-container-scan@v3.2.0
        with:
          image: ${{ secrets.DOCKERHUB_USER }}/task-api-scan:latest
          dockerfile: ./Dockerfile
          severity: HIGH
          annotations: true

      - name: Upload SARIF File
        if: ${{ steps.scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
         
